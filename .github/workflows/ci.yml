name: ci
# Same checks production runs before it moves to a new commit (deploy.test_cmd),
# plus lint and the infrastructure definition. Red here = the host will refuse it.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: system packages (sandbox, PDF text, report conversion)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap poppler-utils pandoc
          # Ubuntu 24.04 blocks unprivileged user namespaces, which bwrap needs
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q -rs
        env:
          CI: "1"

  infra:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
