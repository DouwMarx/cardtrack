# Inclusion criteria, split by who can actually check them.
validator_checked:                   # enforced deterministically; any failure → reject
  publisher_on_allowlist: true
  document_retrievable: true         # fetch succeeded, sane content-type & size
  min_publication_date: "2026-01-01" # scope floor; NULL dates → file_issue
agent_attested:                      # judgment calls; agent must assert, recorded in provenance
  primary_source: true               # the org's own publication, not press coverage
  about_a_specific_model_or_eval: true  # the system-card test: the content could sit in
                                     # the evals section of a system/model card — it
                                     # assesses a NAMED model's capabilities or safety.
                                     # Research that merely uses models does not qualify.
  distinct_model_release: true       # a distinct release/eval — NOT a size, quantization,
                                     # checkpoint, or regional variant of a model already
                                     # covered; family cards → one entry, all model_names
  notable_release: true              # canonical enough to catalog: announced by the org
                                     # (blog/news), widely used, or independently
                                     # covered — not an obscure checkpoint or re-upload
soft:                                # recorded, displayed, filterable — not blocking
  has_safety_evals: null             # quantitative safety/dangerous-capability evals,
                                     # red-teaming, or risk assessment — not a mere
                                     # "limitations" paragraph. Drives the site's
                                     # safety filter; absence is itself a finding.
  has_quantitative_data: null
  pdf_available: null
policy:
  # Inclusion philosophy (2026-08-10): the allowlist is the gate. Allowlisted
  # publishers auto-merge regardless of tier (tier is a provenance label only).
  # We accept slightly more false positives and curate OUT via issues/removals;
  # issues are never a pre-approval queue. Validator-filed issues remain only for
  # suspected duplicates — genuine exclusion judgment calls.
  # (Rationale: human review time is this system's scarcest resource.)
  when_uncertain: admit_and_flag
