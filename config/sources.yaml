# The allowlist: two categories (publishers = first-party, evaluators = independent).
# tier is a provenance/confidence LABEL recorded on every write — it gates nothing.
# Being on this list is the only inclusion gate; curation happens post-merge
# (detect-and-revert: a bad row is one git revert away, a missed doc is invisible).
# index_urls are pages Phase A diffs for new links. Some publishers bot-block
# scripted fetches (OpenAI /news, Meta blog); index diffing quietly skips
# failures and agent web search covers the gap.
# Hugging Face orgs get two index_urls: the HTML org page and the JSON API listing
# sorted by creation time. The HTML page orders repos by activity and lags new
# uploads by days (Qwen3.8 surfaced 5 days late; a flagship Hunyuan release never
# did); the API lists them the moment they are created.
# Verified reachable with a browser UA on 2026-08-09.
# scope (optional): what of this publisher's output is in scope. The agent MUST
# honor it when triaging leads from that publisher's index pages — HF org pages
# surface every repo the org pushes, and criteria.yaml covered_model_class plus
# these notes are what keep auxiliary-model noise out.

publishers:            # first-party
  anthropic:
    tier: 1
    display_name: Anthropic
    homepage: https://www.anthropic.com
    index_urls:
      - https://www.anthropic.com/news
      - https://www.anthropic.com/transparency/model-report
      - https://www.anthropic.com/research
  openai:
    tier: 1
    display_name: OpenAI
    homepage: https://openai.com
    index_urls:
      - https://deploymentsafety.openai.com/
  google_deepmind:
    tier: 1
    display_name: Google DeepMind
    scope: >-
      From the ai.google / labs.google index pages, only gated-program and access pages (science/trusted-tester programs) qualify — skip product marketing, nav, and consumer-feature links they surface in bulk.
    homepage: https://deepmind.google
    index_urls:
      - https://deepmind.google/discover/blog/
      - https://deepmind.google/models/model-cards/
      - https://ai.google/gemini-for-science    # science access program (Co-Scientist etc.);
      - https://labs.google/science             # gated-experiment registration portal
  meta:
    tier: 1
    display_name: Meta AI
    homepage: https://ai.meta.com
    index_urls:         # reachable since the browser-impersonation fetch fallback
      - https://ai.meta.com/blog/
      - https://research.meta.ai/blog/
  mistral:
    tier: 2
    display_name: Mistral AI
    scope: >-
      Frontier LLM/VLM releases (Mistral Large/Small/Medium, Magistral, Pixtral, Devstral). NOT: OCR, moderation/guardrail, transcription/TTS point releases from the docs product pages.
    homepage: https://mistral.ai
    index_urls:
      - https://mistral.ai/news/
  xai:
    tier: 2
    display_name: xAI
    homepage: https://x.ai
    index_urls:
      - https://x.ai/news
      - https://x.ai/safety
  cursor:                # co-publishes cards for models it ships (e.g. the Grok 4.5
    tier: 2              # launch-day card, whose original revision only exists here)
    display_name: Cursor
    homepage: https://cursor.com
    index_urls:
      - https://cursor.com/blog
  alibaba_qwen:
    tier: 2
    display_name: Alibaba Qwen
    scope: >-
      Qwen LLM/VLM/generative lines. NOT: ASR, embeddings, forced aligners.
    homepage: https://qwen.ai
    index_urls:            # qwen.ai renders client-side (unfetchable); HF org covers releases
      - https://huggingface.co/Qwen
      - https://huggingface.co/api/models?author=Qwen&sort=createdAt&direction=-1&limit=100
  thinking_machines:
    tier: 1
    display_name: Thinking Machines Lab
    homepage: https://thinkingmachines.ai
    index_urls:
      - https://thinkingmachines.ai/blog/
  deepseek:
    tier: 1
    display_name: DeepSeek
    homepage: https://www.deepseek.com
    index_urls:
      - https://api-docs.deepseek.com/news/
      - https://huggingface.co/deepseek-ai
      - https://huggingface.co/api/models?author=deepseek-ai&sort=createdAt&direction=-1&limit=100
  tencent_hunyuan:
    tier: 1
    display_name: Tencent Hunyuan
    scope: >-
      Hunyuan (Hy) LLM/VLM line, HY-World, flagship embodied/UI agents. NOT: embeddings, retrieval, machine translation, minor checkpoint drops.
    homepage: https://hunyuan.tencent.com
    index_urls:
      - https://huggingface.co/tencent
      - https://huggingface.co/api/models?author=tencent&sort=createdAt&direction=-1&limit=100
  xiaomi:
    tier: 1
    display_name: Xiaomi MiMo
    scope: >-
      MiMo LLM/VLM line. NOT: ASR variants.
    homepage: https://huggingface.co/XiaomiMiMo
    index_urls:
      - https://huggingface.co/XiaomiMiMo
      - https://huggingface.co/api/models?author=XiaomiMiMo&sort=createdAt&direction=-1&limit=100
  nvidia:
    tier: 1
    display_name: NVIDIA
    scope: >-
      Nemotron LLM/VLM family, Cosmos world models, GR00T robotics. NOT: embeddings, OCR/parse, ASR/TTS, vision backbones, detectors, content-safety classifiers, distillation artifacts, quantum decoders/calibration.
    homepage: https://www.nvidia.com
    index_urls:
      - https://huggingface.co/nvidia
      - https://huggingface.co/api/models?author=nvidia&sort=createdAt&direction=-1&limit=100
  moonshot_ai:
    tier: 1
    display_name: Moonshot AI
    homepage: https://www.moonshot.ai
    index_urls:
      - https://huggingface.co/moonshotai
      - https://huggingface.co/api/models?author=moonshotai&sort=createdAt&direction=-1&limit=100
      - https://moonshotai.github.io/
  poolside:
    tier: 2
    display_name: poolside
    homepage: https://poolside.ai
    index_urls:
      - https://poolside.ai/
  stepfun:
    tier: 2
    display_name: StepFun
    homepage: https://www.stepfun.com
    index_urls:
      - https://huggingface.co/stepfun-ai
      - https://huggingface.co/api/models?author=stepfun-ai&sort=createdAt&direction=-1&limit=100
  zai:
    tier: 1
    display_name: Z.ai (Zhipu AI)
    scope: >-
      GLM LLM/VLM line (GLM-5.x, GLM-5V, Flash/Air/Turbo variants) and their technical reports. NOT: GLM-OCR, GLM-ASR/TTS, embeddings, CogVideo/CogView point releases, quantised re-uploads (-FP8/-BF16) of an already-catalogued card.
    homepage: https://z.ai
    index_urls:            # z.ai blog renders client-side; HF org + docs release notes cover releases
      - https://huggingface.co/zai-org
      - https://huggingface.co/api/models?author=zai-org&sort=createdAt&direction=-1&limit=100
      - https://docs.z.ai/release-notes/new-released
  minimax:
    tier: 2
    display_name: MiniMax
    scope: >-
      MiniMax-M LLM line (M2.x, M3) and their technical reports. NOT: Hailuo video, Speech/TTS, music, image models.
    homepage: https://www.minimax.io
    index_urls:
      - https://huggingface.co/MiniMaxAI
      - https://huggingface.co/api/models?author=MiniMaxAI&sort=createdAt&direction=-1&limit=100
      - https://www.minimax.io/news
  inclusion_ai:
    tier: 2
    display_name: InclusionAI (Ant Group)
    scope: >-
      Ling/LLaDA LLM lines, flagship agents. NOT: OCR fine-tunes, guardrail classifiers, tiny size variants.
    homepage: https://huggingface.co/inclusionAI
    index_urls:
      - https://huggingface.co/inclusionAI
      - https://huggingface.co/api/models?author=inclusionAI&sort=createdAt&direction=-1&limit=100

